name: UFC news bot

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ufc-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for news
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot.py

      - name: Save state and page
        run: |
          git config user.name "ufc-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "Update UFC news"
            git push
          fi
