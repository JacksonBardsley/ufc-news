<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFC News Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f1; --surface: #ffffff; --ink: #141414; --muted: #6b6b6b;
    --line: #e2e0dc; --accent: #d20a0a; --chip: #ecebe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0f; --surface: #17171a; --ink: #f1f1f1; --muted: #9a9aa0;
      --line: #26262b; --accent: #ff3b3b; --chip: #222227;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { background: #000; color: #fff; border-bottom: 4px solid var(--accent); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: baseline; justify-content: space-between;
                 gap: 12px; padding-top: 18px; padding-bottom: 14px; flex-wrap: wrap; }
  h1 { font: 700 28px/1 Oswald, sans-serif; letter-spacing: .02em; margin: 0;
       text-transform: uppercase; }
  h1 span { color: var(--accent); }
  #updated { font-size: 13px; color: #b5b5b5; }
  .controls { position: sticky; top: 0; z-index: 2; background: var(--bg);
              border-bottom: 1px solid var(--line); padding: 12px 0; }
  .controls .wrap { display: flex; flex-direction: column; gap: 10px; }
  input[type=search] { width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
          background: var(--chip); color: var(--ink); font: 500 13px Inter, sans-serif; }
  .chip[aria-pressed=true] { background: var(--accent); color: #fff; }
  .day { font: 500 13px Oswald, sans-serif; text-transform: uppercase; letter-spacing: .08em;
         color: var(--muted); margin: 22px 0 8px; }
  .item { display: block; background: var(--surface); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
          color: inherit; text-decoration: none; }
  .item:hover { border-color: var(--accent); }
  .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .src { font-weight: 600; color: var(--accent); }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); }
  .title { font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
  .item.x .title { font-weight: 500; }
  .sum { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
<header><div class="wrap"><h1>UFC <span>News</span> Wire</h1><div id="updated">Loading…</div></div></header>
<div class="controls"><div class="wrap">
  <input id="q" type="search" placeholder="Search fighters, events…" aria-label="Search">
  <div class="chips" id="kinds"></div>
  <div class="chips" id="sources"></div>
</div></div>
<main class="wrap" id="list"></main>
<script>
const KINDS = [["all", "All"], ["news", "News"], ["x", "X"], ["reddit", "Reddit"]];
let data = { items: [] }, kind = "all", source = "all", query = "";

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function dayLabel(ts) {
  const d = new Date(ts * 1000), t = new Date();
  const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}
function chips(el, opts, current, onPick) {
  el.innerHTML = opts.map(([v, l]) =>
    `<button class="chip" aria-pressed="${v === current}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest(".chip"); if (b) onPick(b.dataset.v); };
}
function render() {
  chips(document.getElementById("kinds"), KINDS, kind, v => { kind = v; source = "all"; render(); });
  const pool = data.items.filter(i => kind === "all" || i.kind === kind);
  const srcs = [...new Set(pool.map(i => i.source))].sort();
  chips(document.getElementById("sources"), [["all", "All sources"], ...srcs.map(s => [s, s])],
        source, v => { source = v; render(); });
  const q = query.toLowerCase();
  const rows = pool.filter(i => (source === "all" || i.source === source) &&
    (!q || (i.title + " " + i.summary).toLowerCase().includes(q)));
  let html = "", lastDay = "";
  for (const i of rows) {
    const day = dayLabel(i.ts);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const badge = i.kind === "x" ? "X" : i.kind === "reddit" ? "Reddit" : "";
    html += `<a class="item ${i.kind}" href="${esc(i.link)}" target="_blank" rel="noopener">
      <div class="meta"><span class="src">${esc(i.source)}</span>${badge ? `<span class="badge">${badge}</span>` : ""}<span>${ago(i.ts)}</span></div>
      <div class="title">${esc(i.title)}</div>
      ${i.summary && i.kind !== "x" && !i.summary.startsWith(i.title.slice(0, 40)) ?`<div class="sum">${esc(i.summary)}</div>` : ""}
    </a>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="empty">No stories match.</div>`;
  document.getElementById("updated").textContent = data.updated ? "Updated " + ago(data.updated) : "";
}
async function load() {
  try {
    const r = await fetch("news.json?t=" + Date.now());
    data = await r.json();
  } catch (e) { document.getElementById("updated").textContent = "Couldn't load news"; }
  render();
}
document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
load();
setInterval(load, 120000);
</script>
</body>
</html>
